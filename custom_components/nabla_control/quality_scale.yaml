# Home Assistant Integration Quality Scale
# https://developers.home-assistant.io/docs/integration_quality_scale_index/
#
# Note: Official badges do not apply to custom/HACS integrations.
# This file tracks alignment with Gold-level practices.

rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: todo
    comment: Tests exist but coverage percentage not measured
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: No event entities in this integration
  entity-unique-id: done
  has-entity-name:
    status: todo
    comment: Uses _attr_name directly; migrate to has_entity_name pattern
  runtime-data:
    status: todo
    comment: Uses hass.data[DOMAIN]; migrate to entry.runtime_data
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters:
    status: exempt
    comment: No install-time parameters beyond config flow
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: todo
    comment: Devices poll independently but no explicit parallel_updates constant
  reauthentication-flow:
    status: exempt
    comment: No external authentication required
  test-coverage:
    status: todo
    comment: Tests exist; 95% threshold not measured

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: todo
    comment: ESPHome discovery only; no zeroconf/SSDP
  discovery-update-info:
    status: done
    comment: Follow ESPHome address changes when linked
  docs-data-update:
    status: todo
    comment: Polling behavior described but not in dedicated section
  docs-examples:
    status: done
    comment: Card example in README
  docs-known-limitations:
    status: todo
    comment: Need explicit limitations section
  docs-supported-devices:
    status: done
    comment: Mirror/web device types described
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases:
    status: todo
    comment: Use cases implied but not explicit section
  dynamic-devices:
    status: done
    comment: Devices added via config entries
  entity-category:
    status: done
    comment: Primary controls uncategorized (correct for user-facing actions)
  entity-device-class:
    status: todo
    comment: Buttons use default class; no specific device class needed
  entity-disabled-by-default: done
  entity-translations:
    status: todo
    comment: Config strings translated; entity names not
  exception-translations: done
  icon-translations:
    status: todo
    comment: Icons not using translation keys
  reconfiguration-flow: done
  repair-issues:
    status: todo
    comment: No repair flows implemented
  stale-devices:
    status: todo
    comment: No automatic stale device removal

  # Platinum (not targeted for HACS custom)
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: No py.typed marker or full type coverage
